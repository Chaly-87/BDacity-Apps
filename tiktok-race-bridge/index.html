<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#shell{
  position:relative;
  width:min(100vw,720px);
  height:min(100vh,1280px);
  aspect-ratio:9/16;
  background:#050507;
  overflow:hidden;
}
#game-container{position:absolute;inset:0}
#host-cam{
  position:absolute;right:2.7%;bottom:5.8%;
  width:14.2%;aspect-ratio:0.82;
  border:2px solid #25f4ee;
  border-radius:10px;overflow:hidden;
  background:#111;z-index:20;
  box-shadow:0 0 0 2px #fe2c55,0 0 18px rgba(254,44,85,.35);
}
#host-cam video{
  width:100%;height:100%;object-fit:cover;
  transform:scale(1.02);
  animation:breath 3.8s ease-in-out infinite alternate;
}
#live-tag{
  position:absolute;left:50%;top:3px;transform:translateX(-50%);
  background:#fe2c55;color:#fff;font:bold 9px Arial;
  padding:2px 7px;border-radius:10px;z-index:2;white-space:nowrap
}
@keyframes breath{from{transform:scale(1.00)}to{transform:scale(1.01)}}

#host-panel{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(92%,620px);padding:14px;display:none;z-index:200;
  background:rgba(5,5,9,.97);border:2px solid #25f4ee;border-radius:14px;
  box-shadow:0 0 0 2px #fe2c55,0 18px 50px rgba(0,0,0,.55);
  color:#fff;
}
#host-panel.open{display:block}
#host-panel h3{font-size:15px;margin-bottom:8px;color:#ffd34d}
#host-panel .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
#host-panel button{
  min-height:38px;border:1px solid #333;border-radius:9px;
  background:#15151c;color:#fff;font-weight:700;font-size:11px;cursor:pointer;
}
#host-panel button:active{transform:scale(.98)}
#host-panel .danger{border-color:#fe2c55}
#host-panel .info{border-color:#25f4ee}
#host-panel small{display:block;margin-top:8px;color:#aaa}


</style>

function initHostVideo() {
  const video = document.getElementById("host-video");
  const poster = document.getElementById("host-poster");
  if (!video) return;

  try {
    const binary = atob(HOST_VIDEO_B64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

    const blob = new Blob([bytes], { type: "video/mp4" });
    const url = URL.createObjectURL(blob);
    video.src = url;
    video.muted = true;
    video.loop = true;
    video.playsInline = true;

    const tryPlay = () => {
      const p = video.play();
      if (p && typeof p.then === "function") {
        p.then(() => {
          if (poster) poster.style.opacity = "0";
        }).catch(() => {
          if (poster) poster.style.opacity = "1";
        });
      }
    };

    video.addEventListener("loadeddata", tryPlay, { once: true });
    video.addEventListener("playing", () => {
      if (poster) poster.style.opacity = "0";
    });

    // Browser fallback: first user interaction starts the webcam loop.
    document.addEventListener("pointerdown", tryPlay, { once: true });
    document.addEventListener("keydown", tryPlay, { once: true });
  } catch (err) {
    console.warn("[HostCam] video fallback to poster:", err);
    if (poster) poster.style.opacity = "1";
  }
}

setTimeout(initHostVideo, 50);

    speed:CAR_TIERS[tier].speed,
    hp:CAR_TIERS[tier].durability,
    maxHp:CAR_TIERS[tier].durability,
    nitroUntil:0,stunnedUntil:0,
    broken:false,airborne:false
  };
}

function drawCar(tier,teamColor){
  const cfg=CAR_TIERS[tier];
  const c=scene.add.container(0,0);
  const g=scene.add.graphics();
  const col=tier===0?0x8b8b8b:cfg.color;

  if(tier===0){
    g.fillStyle(col,1);g.fillRoundedRect(-19,-12,38,24,5);
    g.fillStyle(0x5e5e5e,1);g.fillRect(-14,-9,11,7);g.fillRect(3,-7,10,6);
    g.lineStyle(2,0x2b2b2b,1);g.lineBetween(-8,-12,4,12);
  }else if(tier===1){
    g.fillStyle(col,1);g.fillRoundedRect(-22,-12,44,24,7);
    g.fillStyle(0x14202d,1);g.fillRoundedRect(-11,-9,22,10,4);
    g.fillStyle(teamColor,.8);g.fillRect(-21,4,42,4);
  }else if(tier===2){
    g.fillStyle(col,1);g.fillRoundedRect(-25,-12,50,24,9);
    g.fillStyle(0x111827,1);g.fillRoundedRect(-12,-9,24,9,4);
    g.fillStyle(teamColor,1);g.fillRect(-19,7,38,3);
    g.fillRect(-27,10,54,3);
  }else if(tier===3){
    g.fillStyle(col,1);
    g.fillTriangle(-27,11,27,11,17,-14);
    g.fillTriangle(-27,11,-17,-14,17,-14);
    g.fillStyle(0x0f172a,1);g.fillTriangle(-11,-8,11,-8,0,2);
    g.fillStyle(teamColor,.9);g.fillRect(-20,8,40,3);
  }else{
    g.fillStyle(col,1);
    g.fillRoundedRect(-30,-11,60,22,11);
    g.fillTriangle(-30,0,-14,-18,7,-11);
    g.fillTriangle(30,0,14,-18,-7,-11);
    g.fillStyle(0x0b1120,1);g.fillRoundedRect(-12,-9,24,8,4);
    g.lineStyle(2,teamColor,1);g.strokeRoundedRect(-25,-8,50,17,8);
  }

  g.fillStyle(0x050505,1);
  g.fillRoundedRect(-27,-10,7,10,3);g.fillRoundedRect(20,-10,7,10,3);
  g.fillRoundedRect(-27,3,7,10,3);g.fillRoundedRect(20,3,7,10,3);

  c.add(g);c.setScale(cfg.size);
  return c;
}

function bindInput(){
  scene.input.on('pointerdown',()=>{enableAudio();});
  scene.input.keyboard.on('keydown',(e)=>{
    enableAudio();
    const k=e.key.toLowerCase();
    if(['1','2','3','4'].includes(k))selectedTeam=parseInt(k)-1;
    if(k==='c')window.TikTokGameEvent.comment('@Demo'+Phaser.Math.Between(10,99),String(selectedTeam+1));
    if(k==='l')window.TikTokGameEvent.like('@Demo'+(selectedTeam+1),25);
    if(k==='o')window.TikTokGameEvent.follow('@Demo'+(selectedTeam+1));
    if(k==='s')window.TikTokGameEvent.share('@Demo'+(selectedTeam+1));
    if(k==='r')window.TikTokGameEvent.gift('rose',selectedTeam,'@Demo');
    if(k==='d')window.TikTokGameEvent.gift('donut',selectedTeam,'@Demo');
    if(k==='f')window.TikTokGameEvent.gift('rocket',selectedTeam,'@Demo');
    if(k==='g')window.TikTokGameEvent.gift('galaxy',selectedTeam,'@Demo');
    if(k==='b')window.TikTokGameEvent.attackGift('bomb','@Demo',undefined);
    if(k==='e')window.TikTokGameEvent.attackGift('emp','@Demo',undefined);
    if(k==='t')window.TikTokGameEvent.attackGift('tornado','@Demo',undefined);
    if(k==='h')toggleHostPanel();
  });
}

function startRaceCycle(){
  clearTimers();
  resetRaceState();
  startCountdown();
}

function resetRaceState(){
  raceTime=180;raceStarted=false;raceOver=false;
  AudioEngine.bpm=AudioEngine.normalBpm;
  finalSprintActive=false;
  nextEventRaceTime=150;
  eventSerial=0;
  timerText.setText('03:00').setColor('#ffcc00');
  teams.forEach((t,i)=>{
    const r=t.racer;
    r.angle=(i*Math.PI)/2;r.laps=0;r.progress=0;
    r.speed=CAR_TIERS[0].speed;r.tier=0;
    r.hp=CAR_TIERS[0].durability;r.maxHp=r.hp;
    r.nitroUntil=0;r.stunnedUntil=0;r.broken=false;r.airborne=false;
    r.container.setAlpha(1).setScale(1).setRotation(0);
    replaceCar(t,0);
    t.energy=0;t.racePoints=0;
  });
  updateAllHud();
}

function startCountdown(){
  let seq=['3','2','1','GO!'],idx=0;
  const txt=addRaceObj(scene.add.text(360,646,'',{
    fontSize:'112px',fontStyle:'bold',color:'#fff',
    stroke:'#fe2c55',strokeThickness:14
  }).setOrigin(.5).setDepth(100));

  const next=()=>{
    if(idx>=seq.length){
      txt.destroy();
      raceStarted=true;
      pushEvent(`🏁 Corrida ${raceNumber} começou!`);
      startRaceTimer();
      return;
    }
    txt.setText(seq[idx]).setScale(.68);
    scene.tweens.add({targets:txt,scale:1,duration:240,ease:'Back.Out'});
    if(seq[idx]==='GO!'){
      attentionStinger('final');
      playJet(.7);
      playTone(960,.22,'sawtooth',.045);
    }else{
      playTone(420+idx*120,.12,'square',.035);
    }
    idx++;
    addTimer(scene.time.delayedCall(850,next));
  };
  next();
}

function startRaceTimer(){
  addTimer(scene.time.addEvent({
    delay:1000,loop:true,callback:()=>{
      if(!raceStarted||raceOver)return;
      raceTime--;
      timerText.setText(formatTime(raceTime));

      const untilEvent=Math.max(0,raceTime-nextEventRaceTime);
      if(eventCountdownText){
        eventCountdownText.setText(finalSprintActive
          ? '⚡ FINAL SPRINT ATIVO — GIFTS +50% ENERGY'
          : 'EVENTOS: VIEWERS + GIFTS + HOST');
      }

      if(raceTime===20)activateFinalSprint();

      if(raceTime<=10&&raceTime>0){
        timerText.setColor(raceTime%2?'#ff2d55':'#ffffff');
        scene.cameras.main.flash(55,254,44,85,false);
        playTone(720+(10-raceTime)*35,.04,'square',.018);
      }

      if(raceTime<=0)endRace();
    }
  }));
}

function update(){
  if(!raceStarted||raceOver)return;
  const now=scene.time.now;

  teams.forEach((team,i)=>{
    const r=team.racer;
    if(r.broken||r.airborne)return;
    if(now<r.stunnedUntil){
      r.speed=Math.max(.001,r.speed*.94);
    }else{
      const base=CAR_TIERS[r.tier].speed*(finalSprintActive?1.18:1);
      const boosted=now<r.nitroUntil;
      r.speed=Math.max(base,r.speed*(boosted?.995:.986));
      r.angle+=r.speed;
    }

    if(r.angle>=Math.PI*2){
      r.angle-=Math.PI*2;r.laps++;
      pushEvent(`🏁 ${team.name} completou volta ${r.laps}`);
    }

    const rx=222,ry=353;
    r.container.x=360+Math.cos(r.angle)*rx;
    r.container.y=650+Math.sin(r.angle)*ry;
    r.container.rotation=r.angle+Math.PI/2;
    r.progress=r.laps+r.angle/(Math.PI*2);

    if(now<r.nitroUntil&&Math.random()<.28){
      const dot=scene.add.circle(r.container.x,r.container.y,Phaser.Math.Between(3,6),
        r.tier>=3?CYAN:0xff9f43,.7).setDepth(5);
      scene.tweens.add({targets:dot,alpha:0,scale:.2,duration:300,onComplete:()=>dot.destroy()});
    }
  });

  updateAllHud();
}

function replaceCar(team,tier){
  const r=team.racer;
  if(r.vehicle)r.vehicle.destroy();
  r.vehicle=drawCar(tier,team.color);
  r.container.addAt(r.vehicle,0);
  r.tier=tier;
  r.maxHp=CAR_TIERS[tier].durability;
  r.hp=r.maxHp;
  r.speed=Math.max(r.speed,CAR_TIERS[tier].speed);
  updateHp(r);
}

function damageTeam(team,amount){
  const r=team.racer;
  if(r.broken)return;
  r.hp-=Math.max(1,amount/CAR_TIERS[r.tier].armor);
  updateHp(r);
  if(r.hp<=0)breakCar(team);
}

function breakCar(team){
  const r=team.racer;
  r.broken=true;r.speed=0;r.hp=0;updateHp(r);
  pushEvent(`💥 ${team.name} AVARIOU!`);
  playExplosion();
  burst(r.container.x,r.container.y,0xff7a00,14);
  addTimer(scene.time.delayedCall(3200,()=>{
    if(raceOver)return;
    r.broken=false;
    r.hp=Math.max(14,Math.floor(r.maxHp*.42));
    r.speed=CAR_TIERS[r.tier].speed;
    updateHp(r);
    pushEvent(`🔧 ${team.name} voltou à pista.`);
  }));
}

function updateHp(r){
  const ratio=Phaser.Math.Clamp(r.hp/r.maxHp,0,1);
  r.hpBar.width=48*ratio;
  r.hpBar.fillColor=ratio>.55?0x59d85c:ratio>.25?0xffc107:0xff3b30;
}

function addEnergy(team,amount){
  if(finalSprintActive)amount*=1.5;
  team.energy=Math.min(100,team.energy+amount);
  if(team.energy>=100&&!team.energyCooldown)activateUltimate(team);
}

function activateUltimate(team){
  team.energy=0;team.energyCooldown=true;
  const r=team.racer;

  if(team.id===0){
    showBanner('🔥 RED FIRE BOOST',TEAM_COLORS[0]);
    nitro(team,.015,4300);
  }else if(team.id===1){
    showBanner('❄️ BLUE ICE SHIELD',TEAM_COLORS[1]);
    r.hp=Math.min(r.maxHp,r.hp+40);updateHp(r);
    teams.filter(x=>x.id!==1).forEach(x=>x.racer.stunnedUntil=Math.max(x.racer.stunnedUntil,scene.time.now+1200));
  }else if(team.id===2){
    showBanner('💚 GREEN REPAIR PULSE',TEAM_COLORS[2]);
    r.hp=r.maxHp;updateHp(r);
    if(r.broken){r.broken=false;r.speed=CAR_TIERS[r.tier].speed;}
  }else{
    showBanner('💜 PURPLE CHAOS NITRO',TEAM_COLORS[3]);
    nitro(team,.018,3700);
    teams.filter(x=>x.id!==3).forEach(x=>damageTeam(x,8));
  }
  playJet(1.2);attentionStinger('ultimate');
  addTimer(scene.time.delayedCall(7000,()=>team.energyCooldown=false));
}

function nitro(team,amount,duration){
  const r=team.racer;
  if(r.broken)return;
  r.speed+=amount+CAR_TIERS[r.tier].nitro;
  r.nitroUntil=Math.max(r.nitroUntil,scene.time.now+duration);
  burst(r.container.x,r.container.y,CYAN,7);
}

function handleGift(type,teamIndex,sender){
  if(!raceStarted||raceOver)return;
  const rule=GIFT_RULES[type];if(!rule)return;
  const team=teams[Phaser.Math.Clamp(teamIndex??0,0,3)];

  ensureParticipant(sender);
  assignParticipant(sender,team.id,false);
  addSupport(sender,team.id,rule.points,'gift');
  totalGifts++;team.gifts++;

  if(rule.tier>team.racer.tier){
    replaceCar(team,rule.tier);
    showBanner(`⬆️ ${team.name} → ${CAR_TIERS[rule.tier].name}`,team.color);
  }
  team.racer.hp=Math.min(team.racer.maxHp,team.racer.hp+12+rule.tier*6);
  updateHp(team.racer);
  nitro(team,rule.boost,rule.tier>=4?3600:rule.tier>=3?2500:1500);
  addEnergy(team,rule.energy);
  pushEvent(`${rule.label} ${sender} → ${team.name}`);attentionStinger('gift');
  playTone(520+rule.tier*100,.10,'square',.025);
}

function attackGift(type,sender,targetIndex){
  if(!raceStarted||raceOver)return;
  const rule=ATTACKS[type];if(!rule)return;
  ensureParticipant(sender);
  const p=globalParticipants.get(sender);
  if(p&&p.team!=null)addSupport(sender,p.team,rule.points,'attack');

  let target;
  if(Number.isInteger(targetIndex))target=teams[Phaser.Math.Clamp(targetIndex,0,3)];
  else target=[...teams].sort((a,b)=>b.racer.progress-a.racer.progress)[0];

  if(type==='bomb'){
    showBanner(`💣 BOMBA → ${target.name}`,0xff3b30);
    damageTeam(target,28);
    target.racer.stunnedUntil=scene.time.now+1400;
    burst(target.racer.container.x,target.racer.container.y,0xff7a00,18);
    scene.cameras.main.shake(220,.010);
    playExplosion();
  }else if(type==='emp'){
    showBanner(`⚡ EMP CONTRA ${target.name}`,0x25f4ee);
    teams.filter(t=>t.id!==((p&&p.team!=null)?p.team:-1)).forEach(t=>{
      t.racer.stunnedUntil=Math.max(t.racer.stunnedUntil,scene.time.now+2200);
    });
    scene.cameras.main.flash(100,37,244,238,false);
    playTone(120,.35,'sawtooth',.035);
  }else if(type==='tornado'){
    showBanner('🌪️ TORNADO — TODOS VOAM!',0xbf5af2);
    teams.forEach((t,i)=>throwCar(t,i));
    scene.cameras.main.shake(420,.013);
    playJet(1.4);
  }
  pushEvent(`${rule.label} enviado por ${sender}`);attentionStinger('attack');
}

function throwCar(team,i){
  const r=team.racer;if(r.airborne)return;
  r.airborne=true;
  const y0=r.container.y;
  scene.tweens.add({
    targets:r.container,
    y:y0-Phaser.Math.Between(110,190),
    angle:r.container.angle+Phaser.Math.Between(350,720),
    scale:.72,duration:480,ease:'Quad.Out',
    yoyo:true,hold:120,
    onComplete:()=>{
      r.container.setScale(1);
      r.airborne=false;
      damageTeam(team,Phaser.Math.Between(8,16));
      burst(r.container.x,r.container.y,0xd8d8df,7);
    }
  });
}

function ensureParticipant(username){
  if(!username)return;
  if(!globalParticipants.has(username)){
    globalParticipants.set(username,{
      username,team:null,score:0,likes:0,gifts:0,shares:0,follows:0,
      races:0,mvpCount:0,streak:0,
      likeMilestone:0,
      likeMilestoneRewards:0
    });
  }
}

function assignParticipant(username,teamId,announce=true){
  ensureParticipant(username);
  const p=globalParticipants.get(username);
  if(p.team===teamId)return;
  if(p.team!=null)teams[p.team].members.delete(username);
  p.team=teamId;
  teams[teamId].members.add(username);
  if(announce){pushEvent(`🏁 ${username} entrou na equipa ${TEAM_NAMES[teamId]}`);attentionStinger('join');}
}

function addSupport(username,teamId,points,kind){
  ensureParticipant(username);
  assignParticipant(username,teamId,false);
  const p=globalParticipants.get(username);
  p.score+=points;
  if(kind==='like')p.likes+=points;
  if(kind==='share')p.shares++;
  if(kind==='gift'||kind==='attack')p.gifts++;
  teams[teamId].score+=points;
  teams[teamId].racePoints+=points;
  const m=teams[teamId].supporterStats;
  const cur=m.get(username)||0;m.set(username,cur+points);
}

function onComment(username,comment){
  const key=String(comment).trim().toLowerCase();
  if(!(key in TEAM_WORDS))return;
  assignParticipant(username,TEAM_WORDS[key],true);
  updateAllHud();
}


function checkLikeMilestoneReward(username){
  ensureParticipant(username);
  const p=globalParticipants.get(username);
  if(!p || p.team==null) return;

  const reached=Math.floor(p.likes/1000);
  if(reached<=p.likeMilestoneRewards) return;

  const team=teams[p.team];
  const rewardsToApply=reached-p.likeMilestoneRewards;
  p.likeMilestoneRewards=reached;
  p.likeMilestone=reached*1000;

  // Apply once per crossed 1000-like threshold.
  for(let i=0;i<rewardsToApply;i++){
    unlockPowerCarForLikes(username,team,reached-i);
  }
}

function unlockPowerCarForLikes(username,team,milestoneIndex){
  const r=team.racer;

  // 1000 likes = immediate HYPERCAR + long nitro burst.
  // Further 1000-like milestones refresh the power and add extra team energy.
  if(r.tier<4){
    replaceCar(team,4);
  }else{
    r.hp=r.maxHp;
    updateHp(r);
  }

  nitro(team,.020,6500);
  addEnergy(team,35);
  team.score+=250;
  team.racePoints+=250;

  const p=globalParticipants.get(username);
  if(p) p.score+=250;

  showBanner(`🔥 ${username} BATEU ${milestoneIndex*1000} LIKES — HYPERCAR!`,team.color);
  pushEvent(`🏎️ ${username}: ${milestoneIndex*1000} likes → HYPERCAR para ${team.name}`);
  attentionStinger('ultimate');
  playJet(1.35);

  // Special visual burst around the rewarded team car.
  burst(r.container.x,r.container.y,team.color,22);
  scene.cameras.main.flash(120,255,211,77,false);
  scene.cameras.main.shake(180,.007);
}


function onLike(username,count=1){
  count=Math.max(1,Math.min(5000,Number(count)||1));
  ensureParticipant(username);
  const p=globalParticipants.get(username);
  if(p.team==null){
    pushEvent(`❤️ ${username} deu likes — comenta 1/2/3/4!`);
    return;
  }
  totalLikes+=count;
  p.likes+=count;p.score+=count;
  teams[p.team].likes+=count;teams[p.team].score+=count;teams[p.team].racePoints+=count;
  const cur=teams[p.team].supporterStats.get(username)||0;
  teams[p.team].supporterStats.set(username,cur+count);
  addEnergy(teams[p.team],count*.22);
  if(count>=20)nitro(teams[p.team],.003,900);

  // Every 1000 accumulated likes from this specific viewer unlocks a power car.
  checkLikeMilestoneReward(username);
}

function onFollow(username){
  ensureParticipant(username);
  const p=globalParticipants.get(username);
  p.follows++;
  if(p.team==null){
    pushEvent(`➕ ${username} seguiu — escolhe equipa!`);
    return;
  }
  p.score+=20;teams[p.team].score+=20;teams[p.team].racePoints+=20;
  addEnergy(teams[p.team],8);nitro(teams[p.team],.003,900);
  pushEvent(`➕ FOLLOW BOOST → ${teams[p.team].name}`);
}

function onShare(username){
  ensureParticipant(username);
  const p=globalParticipants.get(username);
  if(p.team==null){
    pushEvent(`🔁 ${username} partilhou — escolhe equipa!`);
    return;
  }
  p.shares++;p.score+=30;
  teams[p.team].shares++;teams[p.team].score+=30;teams[p.team].racePoints+=30;
  addEnergy(teams[p.team],13);nitro(teams[p.team],.0045,1200);
  pushEvent(`🔁 SHARE BOOST → ${teams[p.team].name}`);
}

function getTopSupporter(team){
  let best=null,bestScore=-1;
  for(const [u,s] of team.supporterStats.entries()){
    if(s>bestScore){best=u;bestScore=s;}
  }
  return best?{username:best,score:bestScore}:null;
}

function globalTopSupporter(){
  let best=null,bestScore=-1;
  for(const p of globalParticipants.values()){
    if(p.score>bestScore){best=p;bestScore=p.score;}
  }
  return best;
}

function updateAllHud(){
  const sorted=[...teams].sort((a,b)=>b.racer.progress-a.racer.progress);
  const icons=['🥇','🥈','🥉','4️⃣'];
  rankingText.setText(sorted.map((t,i)=>{
    const top=getTopSupporter(t);
    t.racer.supporterLabel.setText(top?top.username:'');
    return `${icons[i]} ${t.name}  V${t.racer.laps}  ${CAR_TIERS[t.racer.tier].name}`;
  }).join('\n'));

  teams.forEach((t,i)=>{
    window._teamHeaderTexts[i].setText(`${t.members.size} players • ${Math.round(t.energy)}%`);
  });

  const top=globalTopSupporter();
  window._topText.setText(top?`${top.username}\n${top.score} pts`:'---\n0 pts');

  if(objectiveText){
    const leader=sorted[0];
    const closest=[...teams].sort((a,b)=>b.energy-a.energy)[0];
    const gap=Math.max(0,100-Math.round(closest.energy));
    objectiveText.setText(
      finalSprintActive
        ? `⚡ FINAL: ${leader.name} lidera • gifts carregam Ultimate +50%`
        : `${leader.name} lidera • ${closest.name} precisa ${gap}% para ULTIMATE`
    );
  }
}


function activateFinalSprint(){
  if(finalSprintActive||raceOver)return;
  finalSprintActive=true;
  AudioEngine.bpm=AudioEngine.finalBpm;attentionStinger('final');showBanner('⚡ FINAL SPRINT — TUDO VALE MAIS!',0xff9f43);
  pushEvent('⚡ FINAL SPRINT: velocidade +18% e gifts +50% energy');
  scene.cameras.main.shake(220,.006);
  teams.forEach(t=>nitro(t,.0045,1400));
  playJet(1.15);
}

function triggerLiveEvent(forcedType){
  if(!raceStarted||raceOver)return;

  const types=['turbo','meteor','repair','blackout','chaos'];
  const type=forcedType||types[eventSerial++%types.length];

  if(type==='turbo'){
    showBanner('🚀 TURBO ZONE — TODOS ACELERAM!',CYAN);
    teams.forEach(t=>nitro(t,.005,1800));
    pushEvent('🚀 LIVE EVENT: Turbo Zone');
    playJet(1.05);
  }
  else if(type==='meteor'){
    const leader=[...teams].sort((a,b)=>b.racer.progress-a.racer.progress)[0];
    showBanner(`☄️ METEORO → ${leader.name}`,0xff7a00);
    damageTeam(leader,18);
    burst(leader.racer.container.x,leader.racer.container.y,0xff7a00,16);
    pushEvent(`☄️ LIVE EVENT: meteoro atingiu ${leader.name}`);
    scene.cameras.main.shake(180,.008);
    playExplosion();
  }
  else if(type==='repair'){
    const weakest=[...teams].sort((a,b)=>(a.racer.hp/a.racer.maxHp)-(b.racer.hp/b.racer.maxHp))[0];
    weakest.racer.hp=weakest.racer.maxHp;
    updateHp(weakest.racer);
    showBanner(`🔧 COMEBACK REPAIR → ${weakest.name}`,0x34c759);
    addEnergy(weakest,18);
    pushEvent(`🔧 LIVE EVENT: ${weakest.name} recebeu comeback`);
    playTone(650,.16,'sine',.025);
  }
  else if(type==='blackout'){
    showBanner('⚡ BLACKOUT EMP!',0x25f4ee);
    teams.forEach(t=>t.racer.stunnedUntil=Math.max(t.racer.stunnedUntil,scene.time.now+900));
    scene.cameras.main.flash(120,20,20,35,false);
    pushEvent('⚡ LIVE EVENT: blackout geral');
    playTone(110,.3,'sawtooth',.03);

function initAudioGraph(){
  if(!audioCtx)return;
  if(AudioEngine.master)return;

  const master=audioCtx.createGain();
  const compressor=audioCtx.createDynamicsCompressor();
  const musicBus=audioCtx.createGain();
  const sfxBus=audioCtx.createGain();

  master.gain.value=.72;
  musicBus.gain.value=0;
  sfxBus.gain.value=.68;

  compressor.threshold.value=-14;
  compressor.knee.value=18;
  compressor.ratio.value=5;
  compressor.attack.value=.003;
  compressor.release.value=.18;

  musicBus.connect(master);
  sfxBus.connect(master);
  master.connect(compressor);
  compressor.connect(audioCtx.destination);

  AudioEngine.master=master;
  AudioEngine.musicBus=musicBus;
  AudioEngine.sfxBus=sfxBus;
}

function noteDuration(){
  return 60 / AudioEngine.bpm / 4; // 16th note
}

function synthNote(freq,start,duration,volume=.025,type='square',destination=null){
  if(!audioCtx||!AudioEngine.enabled)return;
  const out=destination||AudioEngine.musicBus;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();

  o.type=type;
  o.frequency.setValueAtTime(freq,start);

  g.gain.setValueAtTime(.0001,start);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),start+.008);
  g.gain.exponentialRampToValueAtTime(.0001,start+duration);

  o.connect(g);g.connect(out);
  o.start(start);
  o.stop(start+duration+.03);
}

function noiseHit(start,duration=.04,volume=.012,highpass=3000){
  if(!audioCtx||!AudioEngine.enabled)return;
  const length=Math.max(1,Math.floor(audioCtx.sampleRate*duration));
  const buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate);
  const d=buffer.getChannelData(0);
  for(let i=0;i<length;i++)d[i]=(Math.random()*2-1)*(1-i/length);

  const src=audioCtx.createBufferSource();
  const hp=audioCtx.createBiquadFilter();
  const gain=audioCtx.createGain();
  src.buffer=buffer;
  hp.type='highpass';hp.frequency.value=highpass;
  gain.gain.value=volume;
  src.connect(hp);hp.connect(gain);gain.connect(AudioEngine.musicBus);
  src.start(start);
}

function enableAudio(){

function playTone(freq=440,dur=.1,type='sine',vol=.03){
  if(!audioEnabled||!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(AudioEngine.sfxBus||audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
}

function playJet(power=1){
  if(!audioEnabled||!audioCtx)return;
  const len=Math.floor(audioCtx.sampleRate*.35);
  const buffer=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
  const src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();
  src.buffer=buffer;filter.type='bandpass';filter.frequency.value=800+power*500;gain.gain.value=.018*power;
  src.connect(filter);filter.connect(gain);gain.connect(AudioEngine.sfxBus||audioCtx.destination);src.start();
}

// ================================================================
// PART 6 — TIKTOK LIVE BRIDGE
// The browser game does NOT assume a private/official TikTok API.
// A local backend/connector should normalize live events and send
// them through WebSocket to this game.
// ================================================================

const LIVE_CONFIG = {
  enabled: true,
  wsUrl: `${location.protocol==='https:'?'wss':'ws'}://${location.host}`,
  reconnectMs: 3000,
  dedupeMs: 10000,
  likeFlushMs: 800,
  maxBufferedLikesPerUser: 1000,
  followOncePerSession: true,
  shareCooldownMs: 10000,
  autoConnect: true
};

const LiveBridge = {
  socket: null,
  connected: false,
  reconnectTimer: null,
  reconnecting: false,
  destroyed: false,
  seenEvents: new Map(),
  likeBuffer: new Map(),
  followed: new Set(),
  lastShare: new Map(),
  giftCombos: new Map(),
  flushTimer: null,
  sessionStartedAt: Date.now()
};

function updateBridgeBadge(text, color) {
  const el = document.getElementById("bridge-tag");
  if (!el) return;
  el.textContent = text;
  el.style.color = color || "#ffd34d";
}

function cleanOldEventIds() {
  const now = Date.now();
  for (const [id, ts] of LiveBridge.seenEvents.entries()) {
    if (now - ts > LIVE_CONFIG.dedupeMs) LiveBridge.seenEvents.delete(id);
  }
}

function isDuplicateLiveEvent(ev) {
  const id = ev && (ev.id ?? ev.eventId ?? ev.event_id);
  if (!id) return false;
  cleanOldEventIds();
  const key = String(id);
  if (LiveBridge.seenEvents.has(key)) return true;
  LiveBridge.seenEvents.set(key, Date.now());
  return false;
}

function normalizeUsername(ev) {
  return String(
    ev.username ??
    ev.uniqueId ??
    ev.user?.uniqueId ??
    ev.user?.username ??
    ev.nickname ??
    "@viewer"
  ).trim() || "@viewer";
}

function normalizeLiveEvent(raw) {
  if (!raw || typeof raw !== "object") return null;

  const type = String(raw.type ?? raw.event ?? raw.eventType ?? "").toLowerCase();
  if (!type) return null;

  return {
    ...raw,
    type,
    username: normalizeUsername(raw)
  };
}

function scheduleReconnect() {
  if (LiveBridge.destroyed || LiveBridge.reconnecting || !LIVE_CONFIG.enabled) return;
  LiveBridge.reconnecting = true;
  clearTimeout(LiveBridge.reconnectTimer);
  LiveBridge.reconnectTimer = setTimeout(() => {
    LiveBridge.reconnecting = false;
    connectTikTokBridge();
  }, LIVE_CONFIG.reconnectMs);
}

function connectTikTokBridge() {
  if (!LIVE_CONFIG.enabled || LiveBridge.destroyed) return;

  if (LiveBridge.socket &&
      (LiveBridge.socket.readyState === WebSocket.OPEN ||
       LiveBridge.socket.readyState === WebSocket.CONNECTING)) {
    return;
  }

  updateBridgeBadge("CONNECTING…", "#ffd34d");

  try {
    const ws = new WebSocket(LIVE_CONFIG.wsUrl);
    LiveBridge.socket = ws;

    ws.addEventListener("open", () => {
      LiveBridge.connected = true;
      LiveBridge.reconnecting = false;
      updateBridgeBadge("TIKTOK LINKED", "#25f4ee");
      pushEvent("🟢 TikTok LIVE bridge ligado");
      console.log("[TikTokBridge] connected:", LIVE_CONFIG.wsUrl);
    });

    ws.addEventListener("message", (msg) => {
      try {
        const payload = JSON.parse(msg.data);
        if (Array.isArray(payload)) {
          payload.forEach(receiveLiveEvent);
        } else {
          receiveLiveEvent(payload);
        }
      } catch (err) {
        console.warn("[TikTokBridge] invalid payload:", err);
      }
    });

    ws.addEventListener("close", () => {
      LiveBridge.connected = false;
      updateBridgeBadge("LOCAL MODE", "#ffd34d");
      LiveBridge.socket = null;
      scheduleReconnect();
    });

    ws.addEventListener("error", () => {
      try { ws.close(); } catch (_) {}
    });
  } catch (err) {
    console.warn("[TikTokBridge] connection failed:", err);
    updateBridgeBadge("LOCAL MODE", "#ffd34d");
    scheduleReconnect();
  }
}

function startLikeBufferFlush() {
  if (LiveBridge.flushTimer) clearInterval(LiveBridge.flushTimer);

  LiveBridge.flushTimer = setInterval(() => {
    if (!LiveBridge.likeBuffer.size) return;

    for (const [username, count] of LiveBridge.likeBuffer.entries()) {
      const safeCount = Math.max(1, Math.min(
        LIVE_CONFIG.maxBufferedLikesPerUser,
        Number(count) || 1
      ));
      window.TikTokGameEvent.like(username, safeCount);
    }

    LiveBridge.likeBuffer.clear();
  }, LIVE_CONFIG.likeFlushMs);
}

function bufferRealLikes(ev) {
  const username = ev.username;
  // IMPORTANT: count is expected to be the NEW likes/delta in this event, not a cumulative lifetime total.
  const count = Math.max(1, Number(
    ev.count ?? ev.likeCount ?? ev.likes ?? 1
  ) || 1);

  const previous = LiveBridge.likeBuffer.get(username) || 0;
  LiveBridge.likeBuffer.set(
    username,
    Math.min(LIVE_CONFIG.maxBufferedLikesPerUser, previous + count)
  );
}

function handleRealFollow(ev) {
  const username = ev.username;

  if (LIVE_CONFIG.followOncePerSession && LiveBridge.followed.has(username)) {
    return;
  }

  LiveBridge.followed.add(username);
  window.TikTokGameEvent.follow(username);
}

function handleRealShare(ev) {
  const username = ev.username;
  const now = Date.now();
  const last = LiveBridge.lastShare.get(username) || 0;

  if (now - last < LIVE_CONFIG.shareCooldownMs) return;

  LiveBridge.lastShare.set(username, now);
  window.TikTokGameEvent.share(username);
}

function getGiftValue(ev) {
  const diamonds = Math.max(1, Number(
    ev.diamondCount ??
    ev.diamonds ??
    ev.gift?.diamondCount ??
    ev.gift?.diamonds ??
    1
  ) || 1);

  const repeat = Math.max(1, Number(
    ev.repeatCount ??
    ev.repeat ??
    ev.combo ??
    1
  ) || 1);

  return {
    diamonds,
    repeat,
    total: diamonds * repeat
  };
}

function updateGiftCombo(username, repeat) {
  const now = Date.now();
  const old = LiveBridge.giftCombos.get(username);

  if (!old || now - old.lastAt > 3500) {
    LiveBridge.giftCombos.set(username, { count: repeat, lastAt: now });
    return repeat;
  }

  old.count += repeat;
  old.lastAt = now;
  return old.count;
}

function classifyGiftAction(ev) {
  // A backend may explicitly choose the game action.
  const explicit = String(
    ev.gameAction ?? ev.action ?? ev.power ?? ""
  ).toLowerCase();

  if (["rose","donut","rocket","galaxy"].includes(explicit)) {
    return { mode:"upgrade", gift:explicit };
  }

  if (["bomb","emp","tornado"].includes(explicit)) {
    return { mode:"attack", attack:explicit };
  }

  const value = getGiftValue(ev).total;

  if (value <= 5)   return { mode:"upgrade", gift:"rose" };
  if (value <= 40)  return { mode:"upgrade", gift:"donut" };
  if (value <= 150) return { mode:"upgrade", gift:"rocket" };
  if (value <= 400) return { mode:"attack", attack:"bomb" };
  if (value <= 800) return { mode:"attack", attack:"emp" };
  if (value <= 1500)return { mode:"attack", attack:"tornado" };
  return { mode:"upgrade", gift:"galaxy" };
}

function resolveParticipantTeam(username, ev) {
  if (Number.isInteger(ev.teamIndex)) {
    return Phaser.Math.Clamp(ev.teamIndex, 0, 3);
  }

  const p = globalParticipants.get(username);
  return p && Number.isInteger(p.team) ? p.team : null;
}

function handleRealGift(ev) {
  const username = ev.username;
  const { repeat, total } = getGiftValue(ev);
  const combo = updateGiftCombo(username, repeat);
  const action = classifyGiftAction(ev);
  const teamIndex = resolveParticipantTeam(username, ev);

  console.log("[TikTokBridge] gift", {
    username,
    giftName: ev.giftName ?? ev.gift?.name,
    totalValue: total,
    combo,
    action,
    teamIndex
  });

  if (action.mode === "upgrade") {
    if (teamIndex === null) {
      pushEvent(`🎁 ${username} enviou presente — comenta 1/2/3/4!`);
      return;
    }

    window.TikTokGameEvent.gift(action.gift, teamIndex, username);

    if (combo >= 5) {
      addEnergy(teams[teamIndex], Math.min(25, combo * 2));
      showBanner(`🔥 ${username} x${combo} COMBO!`, teams[teamIndex].color);
      attentionStinger(combo>=10?'ultimate':'gift');
    }
    return;
  }

  const target = Number.isInteger(ev.targetTeamIndex)
    ? Phaser.Math.Clamp(ev.targetTeamIndex, 0, 3)
    : undefined;

  window.TikTokGameEvent.attackGift(action.attack, username, target);

  const attackName = action.attack.toUpperCase();
  showBanner(`💥 ${username} LANÇOU ${attackName}!`,
    action.attack === "emp" ? CYAN :
    action.attack === "tornado" ? 0xbf5af2 :
    0xff3b30
  );
}


let liveInteractionStarted = false;

function showWaitingForInteraction(){
  raceStarted=false;
  raceOver=false;
  timerText.setText('03:00');
  if(centerBanner){
    centerBanner.setText('💬 À ESPERA DA PRIMEIRA INTERAÇÃO')
      .setBackgroundColor('#111117')
      .setAlpha(1)
      .setScale(.88);
  }
  pushEvent('LIVE pronta — a corrida começa com a primeira interação real.');
}

function ensureRaceStartedFromInteraction(source){
  if(liveInteractionStarted) return;
  liveInteractionStarted=true;
  if(centerBanner) centerBanner.setAlpha(0);
  pushEvent(`⚡ Primeira interação: ${source}`);
  startRaceCycle();
}

function receiveLiveEvent(rawPayload) {
  const ev = normalizeLiveEvent(rawPayload);
  if(ev && ['comment','chat','like','follow','share','gift'].includes(ev.type)){
    ensureRaceStartedFromInteraction(ev.type);
    ensureAudioPlayback();
  }
  if (!ev) return false;
  if (isDuplicateLiveEvent(ev)) return false;

  switch (ev.type) {
    case "comment":
    case "chat":
      window.TikTokGameEvent.comment(
        ev.username,
        ev.comment ?? ev.text ?? ev.message ?? ""
      );
      break;

    case "like":
      bufferRealLikes(ev);
      break;

    case "follow":
      handleRealFollow(ev);
      break;

    case "share":
      handleRealShare(ev);
      break;

    case "gift":
      handleRealGift(ev);
      break;

    case "join":
    case "member":
      // Joining alone does not change the race.
      console.log(`[TikTokBridge] ${ev.username} joined`);
      break;

    default:
      console.log("[TikTokBridge] ignored event:", ev.type, ev);
      return false;
  }

  return true;
}

// Public entry point for any connector/backend.
// Example:
// TikTokLiveBridge.receive({
//   id:"gift-1", type:"gift", username:"@Hugo",
//   diamondCount:500, repeatCount:1
// });
window.TikTokLiveBridge = {
  receive: receiveLiveEvent,
  connect: connectTikTokBridge,
  disconnect: () => {
    LiveBridge.destroyed = true;
    clearTimeout(LiveBridge.reconnectTimer);
    if (LiveBridge.flushTimer) clearInterval(LiveBridge.flushTimer);
    try { LiveBridge.socket?.close(); } catch (_) {}
    LiveBridge.socket = null;
    LiveBridge.connected = false;
    updateBridgeBadge("LOCAL MODE", "#ffd34d");
  },
  setWebSocketUrl: (url) => {
    if (typeof url !== "string" || !/^wss?:\/\//i.test(url)) {
      throw new Error("WebSocket URL must begin with ws:// or wss://");
    }
    LIVE_CONFIG.wsUrl = url;
    LiveBridge.destroyed = false;
    try { LiveBridge.socket?.close(); } catch (_) {}
    LiveBridge.socket = null;
    connectTikTokBridge();
  },
  state: LiveBridge,
  config: LIVE_CONFIG
};

startLikeBufferFlush();

if (LIVE_CONFIG.autoConnect) {
  setTimeout(connectTikTokBridge, 700);
}


window.TikTokGameEvent={
  comment:(username,comment)=>{
    ensureRaceStartedFromInteraction('comment');
    ensureAudioPlayback();
    onComment(username,comment);
  },
  like:(username,count=1)=>{
    ensureRaceStartedFromInteraction('like');
    ensureAudioPlayback();
    onLike(username,count);
  },
  follow:(username)=>{
    ensureRaceStartedFromInteraction('follow');
    ensureAudioPlayback();
    onFollow(username);
  },
  share:(username)=>{
    ensureRaceStartedFromInteraction('share');
    ensureAudioPlayback();
    onShare(username);
  },
  gift:(type,teamIndex=0,sender='@viewer')=>{
    ensureRaceStartedFromInteraction('gift');
    ensureAudioPlayback();
    handleGift(type,teamIndex,sender);
  },
  attackGift:(type,sender='@viewer',targetTeamIndex)=>{
    ensureRaceStartedFromInteraction('gift');
    ensureAudioPlayback();
    attackGift(type,sender,targetTeamIndex);
  },
  selectTeam:(username,teamIndex)=>{
    ensureRaceStartedFromInteraction('comment');
    ensureAudioPlayback();
    assignParticipant(username,Phaser.Math.Clamp(Number(teamIndex)||0,0,3),true);
  }
};

console.log('[Race Arena Part 7] Hooks disponíveis:',Object.keys(window.TikTokGameEvent));
console.log('[DEBUG] 1-4 equipa | C comentário | L likes | O follow | S share | R/D/F/G gifts | B/E/T ataques | H host panel');
console.log('[TikTokBridge] WebSocket esperado:', LIVE_CONFIG.wsUrl);
